
# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is NOT reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: "Ελληνική Βιομηχανική Κληρονομιά"

# email: your-email@example.com

description: >-
  Ο ιστοχώρος αυτός αναπτύχτηκε από τους Μαρία Ζωή Δρακακάκη και Γεώργιο Παπαδόπουλο
  στα πλαίσια εργασίας του μαθήματος "Εργαλεία Προβολής Τουριστικού και Πολιτιστικού Προιόντος"
  του ΠΜΣ "Ψηφιακές Εφαρμογές και Καινοτομία" του Ιονίου Πανεπιστημίου.

baseurl: "heritage-promotion"
url: ""

# twitter_username: jekyllrb
github_username: riggas-ionio/heritage-promotion

# Build settings
markdown: kramdown
theme: minima

plugins:
  - jekyll-feed

collections:
  pois:
    output: true

# ==========================================
# EXTRA SITE SETTINGS
# ==========================================

# Γλώσσα ιστοτόπου
lang: el

# Στοιχεία εμφάνισης και ταυτότητας
author: "Ελληνική Βιομηχανική Κληρονομιά"
tagline: "Ανακαλύψτε τη βιομηχανική ιστορία της Ελλάδας"

# Κοινωνικά δίκτυα
social:
  name: "Ελληνική Βιομηχανική Κληρονομιά"
  links:
    - "https://github.com/riggas-ionio/heritage-promotion"

# Ρυθμίσεις σημείων βιομηχανικής κληρονομιάς
collections:
  pois:
    output: true
    permalink: /pois/:name/

# Προεπιλεγμένες ρυθμίσεις σελίδων
defaults:
  - scope:
      path: ""
    values:
      layout: page

  - scope:
      path: ""
      type: pois
    values:
      layout: page

# Κατηγορίες βιομηχανικής κληρονομιάς
industrial_categories:
  - "Εργοστάσια"
  - "Καπναποθήκες"
  - "Βιομηχανικά μνημεία"
  - "Σιδηροδρομικές εγκαταστάσεις"
  - "Μεταλλεία"
  - "Υδροκίνητες εγκαταστάσεις"

# Πληροφορίες που μπορεί να χρησιμοποιηθούν σε σελίδες
project:
  name: "Ελληνική Βιομηχανική Κληρονομιά"
  university: "Ιόνιο Πανεπιστήμιο"
  program: "Ψηφιακές Εφαρμογές και Καινοτομία"
  subject: "Εργαλεία Προβολής Τουριστικού και Πολιτιστικού Προϊόντος"

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/# Welcome to Jekyll!
