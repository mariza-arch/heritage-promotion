<div id="all-pois-map" aria-label="Χάρτης όλων των σημείων ενδιαφέροντος"></div>
<p id="map-status" role="status">Φόρτωση σημείων στον χάρτη…</p>

<script src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script id="map-pois-data" type="application/json">
[
  {% for poi in site.pois %}
  {
    "title": {{ poi.title | jsonify | replace: '<', '\u003c' }},
    "url": {{ poi.url | relative_url | jsonify }},
    "wikidatum": {{ poi.wikidatum | jsonify }}
  }{% unless forloop.last %},{% endunless %}
  {% endfor %}
]
</script>
<script src="{{ '/assets/js/all-pois-map.js' | relative_url }}" defer></script>
